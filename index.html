```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburbur+</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050509;
    color: white;
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
        radial-gradient(circle at 30% 30%, #7b00ff55, transparent 30%),
        radial-gradient(circle at 70% 70%, #00c8ff44, transparent 30%),
        radial-gradient(circle at 50% 50%, #ff00aa33, transparent 25%);
    animation: move 10s infinite alternate ease-in-out;
    filter: blur(40px);
}

@keyframes move {
    from {
        transform: rotate(0deg) scale(1);
    }
    to {
        transform: rotate(15deg) scale(1.2);
    }
}

.container {
    position: relative;
    text-align: center;
    padding: 60px;
    border-radius: 30px;
    background: #ffffff0b;
    border: 1px solid #ffffff22;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 80px #7b00ff33;
}

h1 {
    font-size: 55px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #b84cff, #00d9ff);
    -webkit-background-clip: text;
    color: transparent;
}

p {
    color: #aaa;
    margin-bottom: 35px;
    font-size: 18px;
}

button {
    border: none;
    padding: 18px 38px;
    border-radius: 14px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: linear-gradient(90deg, #7b00ff, #00aaff);
    box-shadow: 0 0 25px #7b00ff66;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 45px #00aaff99;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<div class="container">
    <h1>Hamburbur+</h1>
    <p>The next generation of Hamburbur.</p>

    <button onclick="comingSoon(this)">
        Download Hamburbur+
    </button>
</div>

<script>
function comingSoon(button) {
    button.innerText = "Coming Soon";
    button.disabled = true;
}
</script>

</body>
</html>
```
